version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: workflow_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis Service for WebSockets
  redis:
    image: redis:7-alpine
    container_name: workflow_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. pgAdmin for Database UI Management
  pgadmin:
    image: dpage/pgadmin4
    container_name: workflow_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db

  backend:
    build: ./backend
    container_name: workflow_backend
    restart: always
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=${FRONTEND_URL}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
    depends_on:
      - db
      - redis
    volumes:
      - media_data:/app/media
  frontend:
    build: ./frontend
    container_name: workflow_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - media_data:/app/media

  # 4. Automated Database Backup Service
  pgbackups:
    image: prodrigestivill/postgres-backup-local
    container_name: workflow_pgbackup
    restart: always
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
    volumes:
      - ./db_backups:/backups
    depends_on:
      - db

volumes:
  postgres_data:
  media_data: